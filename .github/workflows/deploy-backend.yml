name: Deploy backend to Railway

# WHY THIS EXISTS
# Railway's native GitHub auto-deploy stopped working: the service kept its
# `source.repo` (so the dashboard still showed it as connected) but had NO
# DeploymentTrigger, which is the object that actually reacts to a push. With no
# trigger, pushes were silently ignored and every deploy had to be run by hand with
# `railway up`.
#
# This workflow replaces that mechanism with one that lives in the repo, so the
# deploy path is visible, reviewable and cannot silently disappear again. It also
# adds a verification gate the native integration never had — Railway would happily
# build and ship code that does not compile.
#
# The native alternative, if you would rather go back to it:
#     railway service source connect --repo Ganesamurthi-V/Mahathithi \
#       --branch main --service Mahathithi
# That restores Railway-side autodeploys, but gives you no pre-deploy checks.

on:
  push:
    branches: [main]
    # Only build when something that ships actually changed. The admin panel
    # deploys via Vercel and the mobile app is built separately, so a push touching
    # only those must not trigger a backend deploy.
    paths:
      - 'backend/**'
      - '.railwayignore'
      - '.github/workflows/deploy-backend.yml'
  # Manual runs, for redeploying without an empty commit.
  workflow_dispatch:

concurrency:
  # One deploy at a time. cancel-in-progress is deliberately false: cancelling a
  # half-finished deploy can leave the service on a partially replaced build.
  group: railway-backend-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches what Railway resolves in production (node 24.19.0 via "lts"),
          # so CI cannot pass on a version the runtime does not use.
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Required before any typecheck: the code imports types from
        # @prisma/client, which only exist once generated. package.json has no
        # postinstall hook, so `npm ci` alone does not produce them and tsc would
        # fail on missing types rather than on real errors.
        run: npx prisma generate

      - name: Typecheck src
        run: npx tsc --noEmit

      - name: Typecheck scripts
        # tsconfig.json sets exclude: [node_modules, dist, prisma, scripts], so the
        # command above never looks at scripts/. That gap let a duplicate object key
        # (TS1117) sit in import-excel.ts while `tsc --noEmit` reported success —
        # only the editor's language server caught it.
        #
        # Passing files explicitly makes tsc ignore tsconfig entirely, so every
        # option has to be repeated here. These mirror backend/tsconfig.json.
        run: |
          npx tsc --noEmit \
            --strict \
            --esModuleInterop \
            --skipLibCheck \
            --target ES2022 \
            --lib ES2022 \
            --module commonjs \
            --moduleResolution node \
            --resolveJsonModule \
            scripts/*.ts

      - name: Build
        # Proves `npm run build` (tsc -> dist/) succeeds, which is what the
        # production start command depends on.
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    # Guard against forks: a pull_request from a fork has no access to secrets, and
    # this should only ever deploy from this repository.
    if: github.repository == 'Ganesamurthi-V/Mahathithi'
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the deploy token is missing
        # Without this the CLI would fall through to an interactive login prompt and
        # the job would hang until it times out, rather than failing with a usable
        # message.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."
            echo "Create a PROJECT token (Railway -> project -> Settings -> Tokens),"
            echo "scoped to the production environment, then add it under"
            echo "GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install Railway CLI
        # Pinned rather than @latest so a CLI release cannot change deploy behaviour
        # without a reviewed commit. 5.49.1 is the version this was validated with.
        run: npm install -g @railway/cli@5.49.1

      - name: Deploy
        # Uploads from the repository root on purpose: the service is configured
        # with rootDirectory=/backend, so the archive has to contain backend/ at its
        # root. Uploading backend/ directly would make Railway look for
        # /backend/backend and fail. .railwayignore keeps the upload small.
        #
        # --ci streams build logs and then exits, so the job's success reflects the
        # build's success. Without it the CLI attaches to the log stream and waits.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --ci \
            --service Mahathithi \
            --environment production \
            --message "gh-actions ${GITHUB_SHA::7}"

      - name: Report deployment status
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Recent deployments:"
          railway deployment list --json 2>/dev/null | head -c 2000 || true
